# Igual que docker/rest.conf, más un registro con los tiempos de cada petición
# a PostgREST. Solo se usa en el Compose de medición (carga/compose.yaml).
#
# $upstream_response_time: lo que tardó PostgREST, base de datos incluida.
# $upstream_http_server_timing: el desglose que manda PostgREST
# (PGRST_SERVER_TIMING_ENABLED): transaction es la base, response es armar la respuesta.
log_format tiempos '$time_iso8601 $status $request_time $upstream_response_time '
                   '$body_bytes_sent "$upstream_http_server_timing" "$request_uri"';

server {
    listen 8080;
    access_log /dev/stdout tiempos;

    location /rest/v1/ {
        # La API usa la ruta de Supabase. PostgREST sirve desde la raíz.
        proxy_pass http://postgrest:3000/;
        # El laboratorio usa un rol local y la red interna de Compose.
        proxy_set_header Authorization "";
    }

    location / {
        return 404;
    }
}
