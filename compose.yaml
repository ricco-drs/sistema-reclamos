services:
  api:
    build: .
    environment:
      PORT: "3005"
      ALLOWED_ORIGINS: http://localhost:4173,http://localhost:5173,http://localhost:5174
      JWT_SECRET: ${JWT_SECRET:-tefiis-jwt-solo-laboratorio}
      VITE_API_KEY: ${VITE_API_KEY:-clave-simulada-lab11}
      FIREBASE_SERVICE_ACCOUNT: "${FIREBASE_SERVICE_ACCOUNT:-}"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      SUPABASE_URL: http://rest:8080
      SUPABASE_SERVICE_KEY: solo-laboratorio
    ports:
      - "127.0.0.1:3005:3005"
      - "127.0.0.1:4173:4173"
    depends_on:
      rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([3005, 4173].map((port) => fetch('http://127.0.0.1:' + port + (port === 3005 ? '/health' : '/')).then((response) => { if (!response.ok) throw Error(response.status); }))).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  rest:
    image: nginx:1.28-alpine
    volumes:
      - ./docker/rest.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      postgrest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/rest/v1/reclamos?limit=0"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgrest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    environment:
      PGRST_DB_URI: postgres://tefiis:tefiis-db-solo-laboratorio@db:5432/tefiis
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: tefiis_lab
      PGRST_DB_MAX_ROWS: "1000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tefiis
      POSTGRES_PASSWORD: tefiis-db-solo-laboratorio
      POSTGRES_DB: tefiis
    volumes:
      - datos:/var/lib/postgresql/data
      - ./docker/esquema.sql:/docker-entrypoint-initdb.d/10-esquema.sql:ro
      - ./sistema-reclamos/sql/cursos_resueltos.sql:/docker-entrypoint-initdb.d/20-cursos-resueltos.sql:ro
      - ./sistema-reclamos/sql/respuestas_reclamo.sql:/docker-entrypoint-initdb.d/30-respuestas-reclamo.sql:ro
      - ./docker/permisos.sql:/docker-entrypoint-initdb.d/40-permisos.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tefiis", "-d", "tefiis"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  datos:
